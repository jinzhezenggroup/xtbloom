name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cpu-regression:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: "1"
      # The reviewed provider is DYNAMIC_ARCH. Fix its kernel so simulation
      # counts do not change with the hosted runner's physical CPU model.
      OPENBLAS_CORETYPE: Nehalem
      OPENBLAS_NUM_THREADS: "1"
      UV_DEFAULT_INDEX: https://pypi.org/simple
      XTBLOOM_CPU_ISA: baseline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Install xTBloom CPU benchmark environment
        env:
          XTBLOOM_ENABLE_CUDA: "OFF"
        run: |
          uv sync --locked --no-install-project --only-group wheel-build
          openblas="$(
            uv run --no-sync python python/ci/resolve-openblas-wheel.py \
              --manifest cmake/3rdparty/scipy_openblas32_manifest.json | \
              uv run --no-sync python -c \
                'import json, sys; print(json.load(sys.stdin)["provider_path"])'
          )"
          test -f "${openblas}"
          OPENBLAS_PROVIDER="${openblas}" uv run --no-sync python - <<'PY'
          import ctypes
          import os

          provider = ctypes.CDLL(os.environ["OPENBLAS_PROVIDER"])
          provider.scipy_openblas_get_corename.restype = ctypes.c_char_p
          core = provider.scipy_openblas_get_corename().decode("ascii")
          if core != "Nehalem":
              raise SystemExit(f"expected OpenBLAS core Nehalem, got {core}")
          print(f"verified OpenBLAS core: {core}")
          PY
          CMAKE_ARGS="-DXTBLOOM_CPU_LINALG_LIBRARY=${openblas}" \
            uv sync --locked --no-editable --extra test --group wheel-build \
              --reinstall-package xtbloom
          # This hash-complete lock is CI-only and deliberately separate from
          # project metadata and uv.lock. The benchmark toolchain therefore
          # cannot enter package requirements, sdists, or wheels.
          uv pip install --require-hashes \
            --requirement benchmarks/codspeed-requirements.txt
          uv pip check
      - name: Validate benchmark collection
        run: uv run --no-sync pytest benchmarks/codspeed_inference.py --collect-only -q
      - name: Run CodSpeed CPU simulation
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: simulation
          run: uv run --no-sync pytest benchmarks/codspeed_inference.py --codspeed -q
