name: Python wheels

# Builds cross-platform wheels with cibuildwheel (one matrix entry per
# platform, as recommended by cibuildwheel and modeled on DeePMD-kit's
# build_wheel.yml). Each entry tells cibuildwheel exactly which build to
# produce via CIBW_BUILD and which test (if any) to run through cibuildwheel's
# own test feature.
#
# - Linux x86_64 builds a CUDA-enabled wheel in the PyPA CUDA manylinux image
#   ([tool.cibuildwheel] in pyproject.toml) and runs the full conformance suite
#   via `test-extras` (deps from the package's `[test,cuda12]` optional
#   dependencies).
# - Linux aarch64 builds CUDA-enabled on the native ARM runner (no QEMU) and
#   runs a real CPU inference through the installed wheel and scipy-openblas32.
# macOS/Windows artifacts are intentionally not published until their CPU
# eigensolver runtime is functional; an import-only wheel is not a usable
# scientific package.

on:
  # Pull requests already build and test wheels. Limit push runs to main so a
  # same-repository PR branch does not schedule duplicate wheel builds.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels for ${{ matrix.platform_id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux-64 (CUDA-enabled wheels + full test suite)
          - os: ubuntu-24.04
            platform_id: manylinux_x86_64
            build: "cp311-manylinux_x86_64"
            variant: cuda
            tests: full
          # linux-aarch64 (CUDA-enabled wheels, native ARM runner)
          - os: ubuntu-24.04-arm
            platform_id: manylinux_aarch64
            build: "cp311-manylinux_aarch64"
            variant: cuda
            tests: cpu
    steps:
      - uses: actions/checkout@v7
      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # ${{ runner.temp }} is not available in job-level env, so each step
          # references the same host paths directly. Inside the manylinux
          # container the host root is mounted at /host, and CIBW_ENVIRONMENT
          # below points CCACHE_DIR at /host${{ runner.temp }}/ccache, so this
          # host directory is where the container's ccache actually persists.
          # Cache writes happen only for pushes to main and same-repository
          # PRs (fork PRs have read-only cache access, so untrusted code cannot
          # plant entries; this workflow has no pull_request_target trigger).
          path: ${{ runner.temp }}/ccache
          # ccache hashes compiler identity and flags itself, so a toolkit or
          # compiler change only costs cache hits, never stale objects.
          key: ccache-wheel-${{ matrix.platform_id }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'include/**', 'src/**', 'tests/**', 'pyproject.toml') }}
          restore-keys: |
            ccache-wheel-${{ matrix.platform_id }}-
      - name: Restore cibuildwheel tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # CIBW_CACHE_PATH is cibuildwheel's own tool-download cache (see the
          # cibuildwheel docs, "Caching cibuildwheel's downloaded tools"); it is
          # always a host-directory path, unlike the ccache directory.
          path: ${{ runner.temp }}/cibw-cache
          # The x86_64 and aarch64 jobs run concurrently. Keep their immutable
          # cache keys distinct so both jobs can persist architecture-specific
          # tool downloads instead of racing to save the same Linux key.
          key: cibw-${{ runner.os }}-${{ matrix.platform_id }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            cibw-${{ runner.os }}-${{ matrix.platform_id }}-
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2
        env:
          CIBW_ARCHS: all
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_CACHE_PATH: ${{ runner.temp }}/cibw-cache
          # Inside the manylinux container the host filesystem is mounted at
          # /host, so CCACHE_DIR=/host/... persists the ccache on the host
          # where actions/cache can save it after the job. The XTBLOOM_*_LAUNCHER
          # variables map to CMAKE_*_COMPILER_LAUNCHER defines in pyproject.toml
          # and enable caching for the C, C++, and nvcc compilations.
          CIBW_ENVIRONMENT: "XTBLOOM_ENABLE_CUDA=${{ matrix.variant == 'cuda' && 'ON' || 'OFF' }} XTBLOOM_C_COMPILER_LAUNCHER=ccache XTBLOOM_CXX_COMPILER_LAUNCHER=ccache XTBLOOM_CUDA_COMPILER_LAUNCHER=ccache CCACHE_DIR=/host${{ runner.temp }}/ccache CCACHE_MAXSIZE=1G"
          # Hosted wheel builders have no NVIDIA kernel driver.  Expose the
          # toolkit stub only inside the isolated wheel test so the dynamic
          # driver resolver can exercise its no-device fallback; production
          # code never searches or preloads stubs. A real-GPU forced-CUDA test
          # is run separately on the project GPU before merge/release.
          CIBW_TEST_COMMAND: bash {project}/python/ci/run-wheel-test.sh ${{ matrix.tests }} {project}
          CIBW_TEST_EXTRAS: ${{ matrix.tests == 'full' && 'test,cuda12' || '' }}
        with:
          output-dir: wheelhouse
          # cibuildwheel[uv]: install uv so `build-frontend = "build[uv]"`
          # (pyproject.toml) can use it for builds and test environments.
          extras: "uv"
      - name: Enforce PyPI wheel size limit
        run: python python/ci/check-wheel-size.py wheelhouse
      - name: Verify Torch wheel payload
        run: python python/ci/check-torch-distribution.py --wheel wheelhouse/*.whl
      - name: Verify wheel licenses
        run: python tools/licensing/check_licenses.py --source-root . wheelhouse/*.whl
      - name: Inspect CUDA host-library dependencies
        run: >-
          python python/ci/inspect-cuda-wheel.py
          --checker tests/abi/check_cuda_dependencies.py
          --readelf readelf
          wheelhouse/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: xtbloom-wheels-${{ matrix.platform_id }}
          path: ./wheelhouse/*.whl

  pass:
    name: Pass building wheels
    needs: [build_wheels]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
