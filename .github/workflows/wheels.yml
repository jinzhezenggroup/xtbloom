name: Python wheels

# Builds wheels directly from complete Git checkouts so every platform resolves
# the product version from the reachable release tag. The independent sdist job
# verifies that unpacked source archives retain the same frozen version through
# PKG-INFO when Git metadata is no longer present.
#
# - Linux x86_64 builds a CUDA-enabled wheel in the PyPA CUDA manylinux image
#   ([tool.cibuildwheel] in pyproject.toml) and runs the full conformance suite
#   via `test-extras` (deps from the package's `[test,cuda12]` optional
#   dependencies).
# - Linux aarch64 builds CUDA-enabled on the native ARM runner (no QEMU) and
#   runs a real CPU inference through the wheel's private OpenBLAS provider.
# - Windows x64/ARM64 and macOS Intel/Apple Silicon build native CPU-only
#   platform wheels on their matching hosted runners. Each bundles a reviewed
#   scipy-openblas32 provider cohort and runs installed-wheel GFN2 inference,
#   missing-provider, concurrency, and host-BLAS coexistence checks. Windows
#   AMD64 and macOS arm64 additionally ship and run the compiled Torch stable-
#   ABI op; upstream PyTorch publishes no supported Windows ARM64 or macOS
#   x86_64 runtime wheel, so those artifacts explicitly contain no Torch op.
# - Pyodide builds the current CPython 3.14 pyemscripten wheel on Linux; the
#   explicit platform field is required because its host runner is also Ubuntu.
#   It remains CI-only until the Python wheel has a production WebAssembly
#   eigensolver path. Trusted Publishing receives the inference-tested native
#   wheels plus the sdist.

on:
  # Pull requests already build and test wheels. Limit push runs to main so a
  # same-repository PR branch does not schedule duplicate wheel builds.
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a clean exact strict release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git describe --tags --exact-match HEAD)" = "$GITHUB_REF_NAME"
          test -z "$(git status --porcelain)"
      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.7"
          python-version: "3.11"
          enable-cache: true
      - name: Build source distribution
        run: uv build --sdist --out-dir source-dist
      - name: Verify source archive version and licenses
        shell: bash
        run: |
          mapfile -t archives < <(find source-dist -maxdepth 1 -name 'xtbloom-*.tar.gz' -print)
          test "${#archives[@]}" -eq 1
          version=$(tar -xOzf "${archives[0]}" --wildcards '*/PKG-INFO' |
            sed -n 's/^Version: //p')
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$version" = "${GITHUB_REF_NAME#v}"
          fi
          python tools/licensing/check_licenses.py --source-root . "${archives[0]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: xtbloom-pypi-sdist
          path: source-dist/*.tar.gz
          if-no-files-found: error

  build_wheels:
    name: Build wheels for ${{ matrix.platform_id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux-64 (CUDA-enabled wheels + full test suite)
          - os: ubuntu-24.04
            platform_id: manylinux_x86_64
            build: "cp311-manylinux_x86_64"
            platform: auto
            archs: auto
            variant: cuda
            tests: full
            compiler_cache: true
            bundle_openblas: true
            inspect_openblas_wheel: true
            inspect_cuda_wheel: true
            torch_extension: present
            test_groups: torch-testing
            desktop_test_args: ""
            publish: true
          # linux-aarch64 (CUDA-enabled wheels, native ARM runner)
          - os: ubuntu-24.04-arm
            platform_id: manylinux_aarch64
            build: "cp311-manylinux_aarch64"
            platform: auto
            archs: auto
            variant: cuda
            tests: cpu
            compiler_cache: true
            bundle_openblas: true
            inspect_openblas_wheel: true
            inspect_cuda_wheel: true
            torch_extension: present
            test_groups: torch-testing
            desktop_test_args: ""
            publish: true
          # Windows x86_64 (CPU-only, native hosted runner)
          - os: windows-latest
            platform_id: win_amd64
            build: "cp311-win_amd64"
            platform: auto
            archs: auto
            variant: cpu
            tests: desktop
            compiler_cache: false
            bundle_openblas: true
            inspect_openblas_wheel: true
            inspect_cuda_wheel: false
            torch_extension: present
            test_groups: torch-testing
            desktop_test_args: --torch
            publish: true
          # Windows ARM64 (CPU-only, native hosted runner; upstream support is experimental)
          - os: windows-11-arm
            platform_id: win_arm64
            build: "cp311-win_arm64"
            platform: auto
            archs: auto
            variant: cpu
            tests: desktop
            compiler_cache: false
            bundle_openblas: true
            inspect_openblas_wheel: true
            inspect_cuda_wheel: false
            torch_extension: absent
            test_groups: ""
            desktop_test_args: ""
            publish: true
          # macOS x86_64 (CPU-only, last Intel hosted runner)
          - os: macos-15-intel
            platform_id: macosx_x86_64
            build: "cp311-macosx_x86_64"
            platform: auto
            archs: auto
            # xTBloom uses aligned C++17/C allocation APIs introduced in
            # macOS 10.15. Make the wheel tag reflect that real runtime floor.
            build_environment: "MACOSX_DEPLOYMENT_TARGET=10.15"
            variant: cpu
            tests: desktop
            compiler_cache: false
            bundle_openblas: true
            inspect_openblas_wheel: true
            inspect_cuda_wheel: false
            torch_extension: absent
            test_groups: ""
            desktop_test_args: ""
            # No Torch edge exists in this cohort, so every missing dependency
            # remains a hard delocate failure.
            macos_repair_command: >-
              delocate-wheel --require-archs {delocate_archs}
              -w {dest_dir} -v {wheel}
            publish: true
          # macOS ARM64 (CPU-only, native Apple Silicon hosted runner)
          - os: macos-14
            platform_id: macosx_arm64
            build: "cp311-macosx_arm64"
            platform: auto
            archs: auto
            variant: cpu
            tests: desktop
            compiler_cache: false
            bundle_openblas: true
            inspect_openblas_wheel: true
            inspect_cuda_wheel: false
            torch_extension: present
            test_groups: torch-testing
            desktop_test_args: --torch
            # Torch is intentionally absent from the isolated build. The
            # linkage and OpenBLAS inspectors below prove that its one stable
            # runtime edge is the only unresolved Mach-O dependency allowed.
            macos_repair_command: >-
              delocate-wheel --exclude libtorch_cpu.dylib
              --ignore-missing-dependencies --require-archs {delocate_archs}
              -w {dest_dir} -v {wheel}
            publish: true
          # Pyodide/WebAssembly (Pyodide 314.x uses the stable PyEmscripten
          # 2026 ABI accepted by PyPI for CPython 3.14 wheels).
          - os: ubuntu-24.04
            platform_id: pyodide_wasm32
            build: "cp314-pyodide_wasm32"
            platform: pyodide
            archs: wasm32
            variant: cpu
            tests: smoke
            compiler_cache: false
            bundle_openblas: false
            inspect_openblas_wheel: false
            inspect_cuda_wheel: false
            torch_extension: absent
            test_groups: ""
            desktop_test_args: ""
            publish: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a clean exact strict release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git describe --tags --exact-match HEAD)" = "$GITHUB_REF_NAME"
          test -z "$(git status --porcelain)"
      - name: Restore ccache
        if: matrix.compiler_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # ${{ runner.temp }} is not available in job-level env, so each step
          # references the same host paths directly. Inside the manylinux
          # container the host root is mounted at /host, and CIBW_ENVIRONMENT
          # below points CCACHE_DIR at /host${{ runner.temp }}/ccache, so this
          # host directory is where the container's ccache actually persists.
          # Cache writes happen only for pushes to main and same-repository
          # PRs (fork PRs have read-only cache access, so untrusted code cannot
          # plant entries; this workflow has no pull_request_target trigger).
          path: ${{ runner.temp }}/ccache
          # ccache hashes compiler identity and flags itself, so a toolkit or
          # compiler change only costs cache hits, never stale objects.
          key: ccache-wheel-${{ matrix.platform_id }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'include/**', 'src/**', 'tests/**', 'pyproject.toml') }}
          restore-keys: |
            ccache-wheel-${{ matrix.platform_id }}-
      - name: Restore cibuildwheel tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # CIBW_CACHE_PATH is cibuildwheel's own tool-download cache (see the
          # cibuildwheel docs, "Caching cibuildwheel's downloaded tools"); it is
          # always a host-directory path, unlike the ccache directory.
          path: ${{ runner.temp }}/cibw-cache
          # The x86_64 and aarch64 jobs run concurrently. Keep their immutable
          # cache keys distinct so both jobs can persist architecture-specific
          # tool downloads instead of racing to save the same Linux key.
          key: cibw-${{ runner.os }}-${{ matrix.platform_id }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            cibw-${{ runner.os }}-${{ matrix.platform_id }}-
      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2
        env:
          CIBW_PLATFORM: ${{ matrix.platform }}
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_TEST_GROUPS: ${{ matrix.test_groups }}
          CIBW_CACHE_PATH: ${{ runner.temp }}/cibw-cache
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ${{ matrix.macos_repair_command }}
          # Inside the manylinux container the host filesystem is mounted at
          # /host, so CCACHE_DIR=/host/... persists the ccache on the host
          # where actions/cache can save it after the job. The XTBLOOM_*_LAUNCHER
          # variables map to CMAKE_*_COMPILER_LAUNCHER defines in pyproject.toml
          # and enable caching for the C, C++, and nvcc compilations.
          CIBW_ENVIRONMENT: ${{ matrix.compiler_cache && format('XTBLOOM_ENABLE_CUDA={0} XTBLOOM_BUNDLE_WHEEL_OPENBLAS=ON XTBLOOM_C_COMPILER_LAUNCHER=ccache XTBLOOM_CXX_COMPILER_LAUNCHER=ccache XTBLOOM_CUDA_COMPILER_LAUNCHER=ccache CCACHE_DIR=/host{1}/ccache CCACHE_MAXSIZE=1G {2}', matrix.variant == 'cuda' && 'ON' || 'OFF', runner.temp, matrix.build_environment || '') || format('XTBLOOM_ENABLE_CUDA=OFF XTBLOOM_BUNDLE_WHEEL_OPENBLAS={0} {1}', matrix.bundle_openblas && 'ON' || 'OFF', matrix.build_environment || '') }}
          # Hosted wheel builders have no NVIDIA kernel driver.  Expose the
          # toolkit stub only inside the isolated wheel test so the dynamic
          # driver resolver can exercise its no-device fallback; production
          # code never searches or preloads stubs. A real-GPU forced-CUDA test
          # is run separately on the project GPU before merge/release.
          CIBW_TEST_COMMAND: ${{ matrix.tests == 'smoke' && 'python -c "import xtbloom; print(xtbloom.library.get_version())"' || matrix.tests == 'desktop' && format('python {{package}}/python/ci/run-desktop-wheel-test.py {0}', matrix.desktop_test_args) || format('bash {{package}}/python/ci/run-wheel-test.sh {0} {{package}}', matrix.tests) }}
          CIBW_TEST_EXTRAS: ${{ matrix.tests == 'full' && 'test,cuda12' || '' }}
        with:
          package-dir: .
          output-dir: wheelhouse
          # cibuildwheel[uv]: install uv so `build-frontend = "build[uv]"`
          # (pyproject.toml) can use it for builds and test environments.
          extras: "uv"
      - name: Enforce PyPI wheel size limit
        run: python python/ci/check-wheel-size.py wheelhouse
      - name: Verify Torch wheel payload
        shell: bash
        run: >-
          python python/ci/check-torch-distribution.py
          --expect ${{ matrix.torch_extension }}
          --wheel wheelhouse/*.whl
      - name: Inspect Torch extension linkage
        if: matrix.torch_extension == 'present'
        shell: bash
        run: >-
          python tests/abi/check_torch_extension_linkage.py
          --symbol-list cmake/3rdparty/torch-stable/aoti_symbols.txt
          --wheel wheelhouse/*.whl
      - name: Verify wheel product-version parity
        shell: bash
        # A Pyodide side module cannot be loaded by the native host Python.
        # Its installed wheel test loads the module inside Pyodide; this
        # archive-level pass still compares METADATA with the public header.
        run: >-
          python python/ci/check-wheel-version.py
          ${{ matrix.platform == 'pyodide' && '--metadata-only' || '' }}
          wheelhouse/*.whl
      - name: Require wheel version to match the release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: >-
          python python/ci/check-wheel-version.py --metadata-only
          --expected-version "${GITHUB_REF_NAME#v}" wheelhouse/*.whl
      - name: Verify wheel licenses
        shell: bash
        run: python tools/licensing/check_licenses.py --source-root . wheelhouse/*.whl
      - name: Inspect private OpenBLAS provider
        if: matrix.inspect_openblas_wheel
        shell: bash
        run: >-
          python python/ci/inspect-openblas-wheel.py
          --manifest cmake/3rdparty/scipy_openblas32_manifest.json
          --readelf readelf
          wheelhouse/*.whl
      - name: Inspect CUDA host-library dependencies
        if: matrix.inspect_cuda_wheel
        shell: bash
        run: >-
          python python/ci/inspect-cuda-wheel.py
          --checker tests/abi/check_cuda_dependencies.py
          --readelf readelf
          wheelhouse/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Only artifacts carrying the pypi marker are visible to the trusted
          # publishing job. The inference-incomplete Pyodide wheel remains
          # downloadable for diagnosis without becoming release-eligible.
          name: ${{ matrix.publish && format('xtbloom-pypi-wheel-{0}', matrix.platform_id) || format('xtbloom-ci-wheel-{0}', matrix.platform_id) }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  pass:
    name: Pass building wheels
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}

  upload_pypi:
    name: Publish release artifacts to PyPI
    needs: [build_sdist, build_wheels, pass]
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      # This trusted job only downloads artifacts produced by the unprivileged
      # build jobs; it never checks out or executes repository-controlled code.
      - name: Download release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # The CI-only Pyodide wheel intentionally uses a different artifact
          # prefix and cannot enter this directory.
          pattern: xtbloom-pypi-*
          path: dist
          merge-multiple: true
      - name: Publish distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, v1.14.2
        with:
          packages-dir: dist
