name: Python wheels

# Builds cross-platform wheels with cibuildwheel and tests them through
# cibuildwheel's own test feature (see `test-command`/`before-test` in
# pyproject.toml). Kept separate from the C++ CI so packaging jobs can be tuned
# independently (see https://cibuildwheel.pypa.io).
#
# - Linux wheels build in the PyPA CUDA manylinux images (see
#   [tool.cibuildwheel.linux] in pyproject.toml) and run the full conformance
#   suite as the cibuildwheel test.
# - macOS wheels build CPU-only and get an import smoke test (their CPU
#   inference needs an MKL runtime exposing the `libmkl_rt.so` names the
#   eigensolver dlopens, which the bundled library does not provide).
# - Windows is a follow-up: the C++ CPU eigensolver uses `dlopen`/`libmkl_rt`
#   and needs a platform port before Windows wheels can build.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v5
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: gpuxtb-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl