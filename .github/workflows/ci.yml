name: CI

on:
  # Pull requests already run the full workflow. Limit push runs to main so a
  # same-repository PR branch does not schedule the same jobs twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep only the newest validation for a pull request. Main pushes use their
# unique run ID, so one merge never cancels another merge's release evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-24.04
    env:
      # Bound the per-job cache so the repository's 10 GiB actions/cache quota
      # is shared across the jobs instead of being consumed by the 5 GiB
      # ccache default. ccache always hashes the exact compiler and flags, so a
      # too-small cache only means fewer hits, never stale objects.
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install --yes ccache
      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # ccache 4 stores its cache under XDG_CACHE_HOME/ccache, which on the
          # runner is ~/.cache/ccache. CCACHE_BASEDIR is left unset because the
          # checkout path is stable across hosted-runner runs. A compiler or
          # toolkit change only costs cache hits, never correctness: ccache
          # hashes the compiler identity and flags itself.
          path: ~/.cache/ccache
          key: ccache-cpu-${{ matrix.compiler }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'include/**', 'src/**', 'tests/**') }}
          restore-keys: |
            ccache-cpu-${{ matrix.compiler }}-
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
          # Instrument the gcc build with gcov coverage flags so the same
          # build+ctest run that validates correctness also produces coverage.
          COVERAGE_FLAGS: ${{ matrix.compiler == 'gcc' && '--coverage' || '' }}
        run: |
          cmake -S . -B build -G Ninja \
            -DXTBLOOM_ENABLE_CUDA=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="${COVERAGE_FLAGS}" \
            -DCMAKE_CXX_FLAGS="${COVERAGE_FLAGS}" \
            -DCMAKE_EXE_LINKER_FLAGS="${COVERAGE_FLAGS}"
      - name: Build
        run: cmake --build build --parallel
      - name: Show ccache statistics
        run: ccache -s
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Collect C++ coverage
        if: matrix.compiler == 'gcc'
        env:
          # Cobertura is the XML schema accepted by actions/upload-code-coverage.
          COVERAGE_XML: coverage-cpp.xml
        run: |
          sudo apt-get update
          sudo apt-get install --yes lcov
          lcov --capture --directory build --output-file coverage.info \
            --exclude '/usr/*' --exclude '*/tests/*' \
            --ignore-errors mismatch,unused
          uvx --from 'lcov_cobertura==2.1.1' lcov_cobertura coverage.info \
            --output "${COVERAGE_XML}"
      - name: Preserve C++ coverage for the upload-only job
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-cpp
          path: coverage-cpp.xml
          retention-days: 1

  python:
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Generate against uv.lock with the matching uv version, then bump
          # `version` and regenerate the lock together.
          version: "0.10.7"
          python-version: "3.11"
          # The torch-testing environment currently fills a roughly 2.6 GiB uv
          # cache. Recent Actions samples spend longer restoring and saving it
          # than a locked PyPI install takes, while also evicting useful ccache
          # entries from the repository cache quota.
          enable-cache: false
      # --locked fails if uv.lock is stale, so an out-of-date lock shows up as
      # a CI failure instead of drifting silently. --no-editable installs the
      # real wheel (not an editable hook), so xtbloom.library can discover the
      # bundled libxtbloom exactly as an installed package does.
      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install --yes ccache
      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-python-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'include/**', 'src/**', 'tests/**', 'pyproject.toml') }}
          restore-keys: |
            ccache-python-
      - name: Install package with test extras
        env:
          XTBLOOM_ENABLE_CUDA: "OFF"
          XTBLOOM_C_COMPILER_LAUNCHER: ccache
          XTBLOOM_CXX_COMPILER_LAUNCHER: ccache
        run: >-
          uv sync --locked --no-editable --extra test
          --group torch-testing
      - name: Show ccache statistics
        run: ccache -s
      - name: Run Python tests with coverage
        run: |
          installed_library="$(uv run --no-sync python -c 'from xtbloom.library import library_path; print(library_path())')"
          test -f "${installed_library}"
          XTBLOOM_LIBRARY="${installed_library}" PYTHONPATH="${PWD}/python" \
            uv run --no-sync pytest python/tests -q --cov \
              --cov-report=xml:coverage-python.xml
          uv run --no-sync python -m unittest -v \
            benchmarks.test_run benchmarks.test_natoms_scaling \
            benchmarks.test_natoms_cross_engine benchmarks.test_dxtb_adapter
      - name: Validate repository-relative Python coverage paths
        run: |
          uv run --no-sync python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          expected = {
              path.as_posix() for path in Path("python/xtbloom").rglob("*.py")
          }
          report = ElementTree.parse("coverage-python.xml")
          reported = {
              node.attrib["filename"] for node in report.findall(".//class")
          }
          if reported != expected:
              missing = sorted(expected - reported)
              unexpected = sorted(reported - expected)
              raise SystemExit(
                  "Python coverage paths must match repository sources; "
                  f"missing={missing}, unexpected={unexpected}"
              )
          PY
      - name: Preserve Python coverage for the upload-only job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-python
          path: coverage-python.xml
          retention-days: 1

  upload-coverage:
    needs: [cpu, python]
    # if: ${{ !cancelled() && needs.cpu.result == 'success' && needs.python.result == 'success' }}
    # disable due to no license
    if: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: coverage-report-cpp
            file: coverage-cpp.xml
            language: C++
            label: code-coverage/cpp
          - artifact: coverage-report-python
            file: coverage-python.xml
            language: Python
            label: code-coverage/python
    runs-on: ubuntu-24.04
    # No pull-request code or dependencies execute with this write-scoped token.
    permissions:
      contents: read
      pull-requests: read
      code-quality: write
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
      - name: Upload coverage to GitHub
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: ${{ matrix.file }}
          language: ${{ matrix.language }}
          label: ${{ matrix.label }}

  licensing-source-distribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Build source distribution
        run: uv build --sdist --out-dir dist-license
      - name: Verify source distribution licenses
        run: python tools/licensing/check_licenses.py --source-root . dist-license/*.tar.gz

  static-cpu-package:
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v7
      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install --yes ccache
      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-static-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'include/**', 'src/**', 'tests/**') }}
          restore-keys: |
            ccache-static-
      - name: Configure static package
        run: |
          cmake -S . -B build-static -G Ninja \
            -DXTBLOOM_ENABLE_CUDA=OFF \
            -DXTBLOOM_BUILD_TESTS=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build and install
        run: |
          cmake --build build-static --parallel
          cmake --install build-static --prefix "${RUNNER_TEMP}/xtbloom-static-install"
          python3 tools/licensing/check_licenses.py --source-root . \
            --install-prefix "${RUNNER_TEMP}/xtbloom-static-install"
      - name: Show ccache statistics
        run: ccache -s
      - name: Consume static exported CMake package
        run: |
          cmake -S tests/install_consumer -B build-static-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/xtbloom-static-install"
          cmake --build build-static-consumer --parallel
          "${PWD}/build-static-consumer/xtbloom_install_consumer" smoke

  public-cpu-release:
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install --yes ccache
      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-public-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'include/**', 'src/**', 'tests/**') }}
          restore-keys: |
            ccache-public-
      - name: Install LP64 eigensolver runtime
        # Keep CI on the reviewed provider ABI. Newer scipy-openblas32 wheels
        # may change optional local-thread-control symbols independently of
        # xtbloom, which would turn this gate into an unreviewed moving target.
        run: uv pip install --system 'scipy-openblas32==0.3.34.0.0'
      - name: Configure shared public inference build
        run: |
          openblas="$(python -c 'from pathlib import Path; import scipy_openblas32; print(Path(scipy_openblas32.get_lib_dir()) / scipy_openblas32.get_library(fullname=True))')"
          test -f "${openblas}"
          cmake -S . -B build-public -G Ninja \
            -DXTBLOOM_ENABLE_CUDA=OFF \
            -DXTBLOOM_CPU_LINALG_LIBRARY="${openblas}" \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-public --parallel
      - name: Show ccache statistics
        run: ccache -s
      - name: Test public inference and conformance
        run: ctest --test-dir build-public --output-on-failure
      - name: Install and consume exported CMake package
        run: |
          cmake --install build-public --prefix "${RUNNER_TEMP}/xtbloom-install"
          python3 tools/licensing/check_licenses.py --source-root . \
            --install-prefix "${RUNNER_TEMP}/xtbloom-install"
          cmake -S tests/install_consumer -B build-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/xtbloom-install"
          cmake --build build-consumer --parallel
          "${PWD}/build-consumer/xtbloom_install_consumer" cpu

  pass:
    name: Pass CI checks
    needs: [cpu, python, licensing-source-distribution, static-cpu-package, public-cpu-release]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
