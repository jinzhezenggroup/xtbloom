name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coverage-cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes lcov
          python3 -m pip install lcov_cobertura
      - name: Configure with coverage instrumentation
        run: |
          cmake -S . -B build-cov -G Ninja \
            -DGPUXTB_ENABLE_CUDA=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_C_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build
        run: cmake --build build-cov --parallel
      - name: Test
        run: ctest --test-dir build-cov --output-on-failure
      - name: Collect coverage
        run: |
          lcov \
            --capture \
            --directory build-cov \
            --output-file coverage.info \
            --exclude '/usr/*' \
            --exclude '*/tests/*' \
            --ignore-errors mismatch,mismatch
          lcov_cobertura coverage.info --output coverage-cpp.xml
      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-cpp
          path: coverage-cpp.xml

  coverage-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install LP64 eigensolver runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libmkl-rt
      - name: Install package with test extras
        env:
          GPUXTB_ENABLE_CUDA: "OFF"
        run: |
          mkl_rt="$(dpkg -L libmkl-rt | awk '/\/libmkl_rt\.so$/ { print; exit }')"
          test -n "${mkl_rt}"
          GPUXTB_MKL_RT_LIBRARY="${mkl_rt}" python -m pip install '.[test]'
      - name: Run Python tests with coverage
        run: python -m pytest python/tests -q --cov=gpuxtb --cov-report=xml:coverage-python.xml
      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-python
          path: coverage-python.xml

  upload-coverage-cpp:
    needs: coverage-cpp
    if: ${{ !cancelled() && needs.coverage-cpp.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-cpp
      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage-cpp.xml
          language: C++
          label: code-coverage-agent

  upload-coverage-python:
    needs: coverage-python
    if: ${{ !cancelled() && needs.coverage-python.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-python
      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage-python.xml
          language: Python
          label: code-coverage-agent
