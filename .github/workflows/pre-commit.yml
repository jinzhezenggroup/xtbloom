name: Pre-commit

# Pull requests run the hooks before merge. Restrict push validation to main so
# same-repository PR branches do not schedule a duplicate push workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Rapid PR updates need only the newest full-file hook result. Main pushes use
# their unique run ID and therefore remain independent release records.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pre_commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Hooks are controlled by the checked-out revision. They need the
          # complete tag history for editable package metadata, never a
          # persisted Git credential.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek/
          key: prek-0.3.1-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: prek-0.3.1-${{ runner.os }}-
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Match the version used to generate uv.lock and cache both the
          # isolated Nox runner and uvx prek downloads across runs.
          version: "0.10.7"
          enable-cache: true
      - name: Run fast Nox validation
        # Exercise the same pinned wrapper used locally. The session itself
        # retains the exact prek pin and also verifies uv.lock consistency.
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
        run: uv run --isolated --locked --only-group nox nox -s fast
