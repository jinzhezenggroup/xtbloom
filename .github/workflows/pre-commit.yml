name: Pre-commit

# Pull requests run the hooks before merge. Restrict push validation to main so
# same-repository PR branches do not schedule a duplicate push workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre_commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Hooks are controlled by the checked-out revision. They need the
          # source tree, never a persisted Git credential.
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/prek/
          key: prek-0.3.1-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: prek-0.3.1-${{ runner.os }}-
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Run pre-commit hooks
        # Pin the runner as well as every hook revision so CI behavior cannot
        # change merely because a new prek release is published.
        run: uvx prek@0.3.1 run --show-diff-on-failure --color=always --all-files
