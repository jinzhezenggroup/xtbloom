# Builds the xtbloom WASM web demo and publishes it to GitHub Pages.
#
# The artifact is a fully client-side GFN2-xTB single-point + geometry
# optimization page: a single-threaded wasm32 module (so no COOP/COEP headers
# are needed, which GitHub Pages cannot configure anyway) that dlopens a
# preloaded minimal LAPACK side module. A separate wasm64 build is retained as
# an ABI/scientific parity gate but is not deployed. The widths build on
# independent runners, then a read-only validation job compares their outputs
# before the trusted main artifact can be published. Everything is produced by
# the CMake web target (web/CMakeLists.txt, enabled here with
# -DXTBLOOM_BUILD_WEB_DEMO=ON).
#
# Deploys only on pushes to main; pull requests build + smoke-test without
# publishing.
name: wasm-web-pages

on:
  push:
    branches: [main]
  # Feature-branch pushes do not trigger a second run: each PR validates once,
  # while the post-merge main push rebuilds the exact artifact that is deployed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.architecture }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: wasm32
            pointer_width: '32'
          - architecture: wasm64
            pointer_width: '64'
    env:
      ARCH_FLAG: -m${{ matrix.pointer_width }}
      BUILD_DIR: build/${{ matrix.architecture }}-web
      CCACHE_MAXSIZE: 1G
      # The SDK action installs the same pinned compiler under a runner-temp
      # path on every job. Hash compiler content, rather than its fresh mtime,
      # and normalize source paths so unchanged objects remain reusable.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      SITE_ARTIFACT: xtbloom-web-${{ matrix.architecture }}
      # Emscripten invokes this wrapper around its internal Clang compilation,
      # including custom web-adapter and side-module commands.
      EM_COMPILER_WRAPPER: ccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node for npm and scientific smoke tests
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Pin both the reviewed setup action and the release compiler version.
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984
        with:
          version: '6.0.6'
          # Cache the pinned SDK itself. The previous ccache covered compiled
          # objects only, so every run still downloaded roughly 300 MiB first.
          actions-cache-folder: emsdk-cache
          # The matrix jobs save independently instead of racing to reserve one
          # cache key on a cold run. The version pin keeps both byte-identical.
          cache-key: emsdk-6.0.6-${{ runner.os }}-${{ runner.arch }}-${{ matrix.architecture }}

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install --yes ccache

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          # ccache validates compiler identity and flags itself. The broad
          # restore prefix therefore safely reuses unchanged objects while a
          # source/configuration hash creates a fresh writable cache entry.
          key: ccache-${{ matrix.architecture }}-emscripten-6.0.6-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'include/**', 'src/**', 'data/parameters/**', 'web/CMakeLists.txt', 'web/*.c', 'web/wasm/**') }}
          restore-keys: |
            ccache-${{ matrix.architecture }}-emscripten-6.0.6-
            ccache-wasm-emscripten-6.0.6-

      - name: Reset ccache statistics
        # Report this job's reuse instead of lifetime counters restored with
        # the cache directory.
        run: ccache --zero-stats

      - name: Install web build dependencies
        run: npm ci --prefix web --ignore-scripts --no-audit --no-fund

      - name: Configure ${{ matrix.architecture }} build
        run: |
          emcmake cmake -S . -B "${BUILD_DIR}" -G Ninja \
            -DXTBLOOM_ENABLE_CUDA=OFF \
            -DXTBLOOM_BUILD_TESTS=OFF \
            -DXTBLOOM_BUILD_WEB_DEMO=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="${ARCH_FLAG} -fPIC" \
            -DCMAKE_CXX_FLAGS="${ARCH_FLAG} -fPIC"

      - name: Build ${{ matrix.architecture }} site
        run: cmake --build "${BUILD_DIR}" --parallel 2

      - name: Show ccache statistics
        run: ccache -s

      - name: Test browser helpers with coverage
        if: matrix.architecture == 'wasm32'
        run: |
          node --test \
            --experimental-test-coverage \
            --test-coverage-include='web/*.js' \
            --test-reporter=spec \
            --test-reporter-destination=stdout \
            --test-reporter=lcov \
            --test-reporter-destination=coverage-web.lcov \
            web/tests/*.test.mjs

          # The helper tests intentionally cover the extracted testable
          # modules, not browser-only workers or generated Emscripten glue.
          coverage_sources="$(sed -n 's/^SF://p' coverage-web.lcov | sort -u)"
          expected_sources=$'web/app_helpers.js\nweb/bootstrap.js\nweb/smiles_helpers.js'
          test "${coverage_sources}" = "${expected_sources}"

      - name: Preserve web coverage for the upload-only job
        if: matrix.architecture == 'wasm32'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-web
          path: coverage-web.lcov
          if-no-files-found: error
          retention-days: 1

      - name: Verify pinned OpenChemLib CDN integration
        if: matrix.architecture == 'wasm32'
        run: node web/tests/openchemlib_smoke.mjs

      - name: Run public C ABI layout and short-initializer checks
        run: |
          emcc "${ARCH_FLAG}" -std=c11 \
            -I"${BUILD_DIR}/generated/include" -Iinclude \
            -c tests/c_api_test.c \
            -o "build/${{ matrix.architecture }}-c-api-test.o"
          EMCC_FORCE_STDLIBS=1 em++ "${ARCH_FLAG}" \
            "build/${{ matrix.architecture }}-c-api-test.o" \
            "${BUILD_DIR}/libxtbloom.a" \
            -o "build/${{ matrix.architecture }}-c-api-test.js" \
            -sMAIN_MODULE=2 -sALLOW_MEMORY_GROWTH
          node "build/${{ matrix.architecture }}-c-api-test.js"

      - name: Check deployed legal payload
        run: >-
          python3 tools/licensing/check_licenses.py --source-root .
          --web-site "${BUILD_DIR}/web/site"

      - name: Run ${{ matrix.architecture }} scientific smoke tests
        # memory64 first shipped in V8 13.3 (Chrome 133); Node 24 is the first
        # Node release line that enables it by default.
        run: node web/tests/wasm_smoke.mjs "${BUILD_DIR}/web/site"

      - name: Preserve ${{ matrix.architecture }} site for parity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.SITE_ARTIFACT }}
          path: ${{ env.BUILD_DIR }}/web/site
          if-no-files-found: error
          retention-days: 1

  upload-coverage:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    # Coverage is an optional reporting service and must never gate the web
    # build, scientific parity validation, or Pages deployment.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download web coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-report-web

      - name: Upload web coverage to Codecov
        # fail_ci_if_error covers CLI upload errors; continue-on-error also
        # covers action setup, integrity-check, and OIDC failures.
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage-web.lcov
          flags: web
          name: code-coverage/web
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true
          version: v11.3.1

  validate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node for dual-width parity
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Restore wasm32 site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: xtbloom-web-wasm32
          path: build/wasm32-web/web/site

      - name: Restore wasm64 site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: xtbloom-web-wasm64
          path: build/wasm64-web/web/site

      - name: Compare wasm32 and wasm64 scientific results
        run: >-
          node web/tests/wasm_parity.mjs
          build/wasm32-web/web/site build/wasm64-web/web/site

      - name: Upload trusted main site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/wasm32-web/web/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This job consumes the already-built Pages artifact and never checks out
      # or executes repository-controlled code with deployment credentials.
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
