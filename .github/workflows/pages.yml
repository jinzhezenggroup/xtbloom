# Builds the xtbloom WASM web demo and publishes it to GitHub Pages.
#
# The artifact is a fully client-side GFN2-xTB single-point + geometry
# optimization page: a single-threaded wasm32 module (so no COOP/COEP headers
# are needed, which GitHub Pages cannot configure anyway) that dlopens a
# preloaded minimal LAPACK side module. A separate wasm64 build is retained as
# an ABI/scientific parity gate but is not deployed. Everything is produced by
# the CMake web target (web/CMakeLists.txt, enabled here with
# -DXTBLOOM_BUILD_WEB_DEMO=ON).
#
# Deploys only on pushes to main; pull requests build + smoke-test without
# publishing.
name: wasm-web-pages

on:
  push:
    branches: [main]
  # Feature-branch pushes do not trigger a second run: each PR validates once,
  # while the post-merge main push rebuilds the exact artifact that is deployed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CCACHE_MAXSIZE: 1G
      # The SDK action installs the same pinned compiler under a runner-temp
      # path on every job. Hash compiler content, rather than its fresh mtime,
      # and normalize source paths so unchanged objects remain reusable.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      # Emscripten invokes this wrapper around its internal Clang compilation,
      # including custom web-adapter and side-module commands.
      EM_COMPILER_WRAPPER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node for npm and dual-width smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Pin both the reviewed setup action and the release compiler version.
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021
        with:
          version: '6.0.6'
          # Cache the pinned SDK itself. The previous ccache covered compiled
          # objects only, so every run still downloaded roughly 300 MiB first.
          actions-cache-folder: emsdk-cache

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install --yes ccache

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          # ccache validates compiler identity and flags itself. The broad
          # restore prefix therefore safely reuses unchanged objects while a
          # source/configuration hash creates a fresh writable cache entry.
          key: ccache-wasm-emscripten-6.0.6-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'include/**', 'src/**', 'data/parameters/**', 'web/CMakeLists.txt', 'web/*.c', 'web/wasm/**') }}
          restore-keys: |
            ccache-wasm-emscripten-6.0.6-

      - name: Reset ccache statistics
        # Report this job's reuse instead of lifetime counters restored with
        # the cache directory.
        run: ccache --zero-stats

      - name: Install web build dependencies once
        # Both pointer-width builds consume the same source-tree node_modules.
        # Resolve it before launching parallel Ninja processes so two npm ci
        # custom commands cannot race while replacing that directory.
        run: |
          npm ci --prefix web --ignore-scripts --no-audit --no-fund
          test -f web/node_modules/3dmol/build/3Dmol-min.js
          # The CMake graph models this bundle as the npm custom-command output.
          # Make it newer than both lock inputs so neither parallel Ninja graph
          # can decide to launch a second source-tree npm ci.
          cmake -E touch web/node_modules/3dmol/build/3Dmol-min.js

      - name: Configure wasm32 deployment build
        run: |
          emcmake cmake -S . -B build/wasm32-web -G Ninja \
            -DXTBLOOM_ENABLE_CUDA=OFF \
            -DXTBLOOM_BUILD_TESTS=OFF \
            -DXTBLOOM_BUILD_WEB_DEMO=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-m32 -fPIC" \
            -DCMAKE_CXX_FLAGS="-m32 -fPIC"

      - name: Configure wasm64 parity build
        run: |
          emcmake cmake -S . -B build/wasm64-web -G Ninja \
            -DXTBLOOM_ENABLE_CUDA=OFF \
            -DXTBLOOM_BUILD_TESTS=OFF \
            -DXTBLOOM_BUILD_WEB_DEMO=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-m64 -fPIC" \
            -DCMAKE_CXX_FLAGS="-m64 -fPIC"

      - name: Build wasm32 and wasm64 sites concurrently
        # Each build retains its existing two-way Ninja bound. Running the
        # independent pointer widths together uses the hosted runner's cores
        # without increasing either build's own compiler concurrency.
        run: |
          set -euo pipefail
          cmake --build build/wasm32-web --parallel 2 2>&1 \
            | sed -u 's/^/[wasm32] /' &
          wasm32_pid=$!
          cmake --build build/wasm64-web --parallel 2 2>&1 \
            | sed -u 's/^/[wasm64] /' &
          wasm64_pid=$!

          status=0
          wait "${wasm32_pid}" || status=$?
          wait "${wasm64_pid}" || status=$?
          exit "${status}"

      - name: Show ccache statistics
        run: ccache -s

      - name: Test browser helpers
        run: npm test --prefix web

      - name: Verify pinned OpenChemLib CDN integration
        run: node web/tests/openchemlib_smoke.mjs

      - name: Run public C ABI layout and short-initializer checks
        # The two widths use disjoint objects and executables, so compile, link,
        # and Node execution can proceed in parallel while preserving each
        # width's complete public-ABI validation chain.
        run: |
          set -euo pipefail
          run_abi_check() {
            local width="$1"
            emcc "-m${width}" -std=c11 -Iinclude -c tests/c_api_test.c \
              -o "build/wasm${width}-c-api-test.o" &&
            EMCC_FORCE_STDLIBS=1 em++ "-m${width}" \
              "build/wasm${width}-c-api-test.o" \
              "build/wasm${width}-web/libxtbloom.a" \
              -o "build/wasm${width}-c-api-test.js" \
              -sMAIN_MODULE=2 -sALLOW_MEMORY_GROWTH &&
            node "build/wasm${width}-c-api-test.js"
          }

          run_abi_check 32 2>&1 | sed -u 's/^/[wasm32 ABI] /' &
          wasm32_pid=$!
          run_abi_check 64 2>&1 | sed -u 's/^/[wasm64 ABI] /' &
          wasm64_pid=$!

          status=0
          wait "${wasm32_pid}" || status=$?
          wait "${wasm64_pid}" || status=$?
          exit "${status}"

      - name: Check deployed legal payload
        run: |
          python3 tools/licensing/check_licenses.py --source-root . \
            --web-site build/wasm32-web/web/site
          python3 tools/licensing/check_licenses.py --source-root . \
            --web-site build/wasm64-web/web/site

      - name: Run wasm32 scientific smoke tests
        run: node web/tests/wasm_smoke.mjs build/wasm32-web/web/site

      - name: Run wasm64 scientific smoke tests
        # memory64 first shipped in V8 13.3 (Chrome 133); Node 24 is the first
        # Node release line that enables it by default.
        run: node web/tests/wasm_smoke.mjs build/wasm64-web/web/site

      - name: Compare wasm32 and wasm64 scientific results
        run: >-
          node web/tests/wasm_parity.mjs
          build/wasm32-web/web/site build/wasm64-web/web/site

      - name: Upload trusted main site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/wasm32-web/web/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This job consumes the already-built Pages artifact and never checks out
      # or executes repository-controlled code with deployment credentials.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
