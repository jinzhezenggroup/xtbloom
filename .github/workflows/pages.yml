# Builds the xtbloom WASM web demo and publishes it to GitHub Pages.
#
# The artifact is a fully client-side GFN2-xTB single-point + geometry
# optimization page: a single-threaded wasm32 module (so no COOP/COEP headers
# are needed, which GitHub Pages cannot configure anyway) that dlopens a
# preloaded minimal LAPACK side module. A separate wasm64 build is retained as
# an ABI/scientific parity gate but is not deployed. Everything is produced by
# the CMake web target (web/CMakeLists.txt, enabled here with
# -DXTBLOOM_BUILD_WEB_DEMO=ON).
#
# Deploys only on pushes to main; pull requests build + smoke-test without
# publishing.
name: wasm-web-pages

on:
  push:
    branches: [main]
  # Feature-branch pushes do not trigger a second run: each PR validates once,
  # while the post-merge main push rebuilds the exact artifact that is deployed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CCACHE_MAXSIZE: 1G
      # Emscripten invokes this wrapper around its internal Clang compilation,
      # including custom web-adapter and side-module commands.
      EM_COMPILER_WRAPPER: ccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node for npm and dual-width smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Pin both the reviewed setup action and the release compiler version.
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021
        with:
          version: '6.0.6'

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install --yes ccache

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          # ccache validates compiler identity and flags itself. The broad
          # restore prefix therefore safely reuses unchanged objects while a
          # source/configuration hash creates a fresh writable cache entry.
          key: ccache-wasm-emscripten-6.0.6-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'include/**', 'src/**', 'data/parameters/**', 'web/CMakeLists.txt', 'web/*.c', 'web/wasm/**') }}
          restore-keys: |
            ccache-wasm-emscripten-6.0.6-

      - name: Configure wasm32 deployment build
        run: |
          emcmake cmake -S . -B build/wasm32-web -G Ninja \
            -DXTBLOOM_ENABLE_CUDA=OFF \
            -DXTBLOOM_BUILD_TESTS=OFF \
            -DXTBLOOM_BUILD_WEB_DEMO=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-m32 -fPIC" \
            -DCMAKE_CXX_FLAGS="-m32 -fPIC"

      - name: Build wasm32 deployment site
        run: cmake --build build/wasm32-web --parallel 2

      - name: Configure wasm64 parity build
        run: |
          emcmake cmake -S . -B build/wasm64-web -G Ninja \
            -DXTBLOOM_ENABLE_CUDA=OFF \
            -DXTBLOOM_BUILD_TESTS=OFF \
            -DXTBLOOM_BUILD_WEB_DEMO=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-m64 -fPIC" \
            -DCMAKE_CXX_FLAGS="-m64 -fPIC"

      - name: Build wasm64 parity site
        run: cmake --build build/wasm64-web --parallel 2

      - name: Show ccache statistics
        run: ccache -s

      - name: Test browser helpers
        run: npm test --prefix web

      - name: Verify pinned OpenChemLib CDN integration
        run: node web/tests/openchemlib_smoke.mjs

      - name: Run public C ABI layout and short-initializer checks
        run: |
          emcc -m32 -std=c11 -Ibuild/wasm32-web/generated/include -Iinclude \
            -c tests/c_api_test.c \
            -o build/wasm32-c-api-test.o
          EMCC_FORCE_STDLIBS=1 em++ -m32 build/wasm32-c-api-test.o \
            build/wasm32-web/libxtbloom.a -o build/wasm32-c-api-test.js \
            -sMAIN_MODULE=2 -sALLOW_MEMORY_GROWTH
          node build/wasm32-c-api-test.js

          emcc -m64 -std=c11 -Ibuild/wasm64-web/generated/include -Iinclude \
            -c tests/c_api_test.c \
            -o build/wasm64-c-api-test.o
          EMCC_FORCE_STDLIBS=1 em++ -m64 build/wasm64-c-api-test.o \
            build/wasm64-web/libxtbloom.a -o build/wasm64-c-api-test.js \
            -sMAIN_MODULE=2 -sALLOW_MEMORY_GROWTH
          node build/wasm64-c-api-test.js

      - name: Check deployed legal payload
        run: |
          python3 tools/licensing/check_licenses.py --source-root . \
            --web-site build/wasm32-web/web/site
          python3 tools/licensing/check_licenses.py --source-root . \
            --web-site build/wasm64-web/web/site

      - name: Run wasm32 scientific smoke tests
        run: node web/tests/wasm_smoke.mjs build/wasm32-web/web/site

      - name: Run wasm64 scientific smoke tests
        # memory64 first shipped in V8 13.3 (Chrome 133); Node 24 is the first
        # Node release line that enables it by default.
        run: node web/tests/wasm_smoke.mjs build/wasm64-web/web/site

      - name: Compare wasm32 and wasm64 scientific results
        run: >-
          node web/tests/wasm_parity.mjs
          build/wasm32-web/web/site build/wasm64-web/web/site

      - name: Upload trusted main site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/wasm32-web/web/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This job consumes the already-built Pages artifact and never checks out
      # or executes repository-controlled code with deployment credentials.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
