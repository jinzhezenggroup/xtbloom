[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "gpuxtb"
version = "0.1.0"
description = "Batched CPU and GPU inference for GFN-xTB through the public C ABI"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = [
  "LICENSE",
  "CUDA_MKL_LINKING_EXCEPTION",
  "THIRD_PARTY_NOTICES.md",
  "LICENSES/*.txt",
  "data/parameters/d4.NOTICE",
  "data/parameters/licenses/*",
]
requires-python = ">=3.10"
authors = [{ name = "gpuxtb developers" }]
keywords = ["xtb", "tight-binding", "semiempirical", "qm", "gpu"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.20",
  # One BSD-licensed LP64 LAPACKE+CBLAS runtime serves both Linux wheel
  # architectures. Its scipy_-prefixed ABI avoids interposing on NumPy's BLAS.
  "scipy-openblas32>=0.3.34.0.0; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]

[project.optional-dependencies]
ase = ["ase"]
dpdata = ["dpdata"]
# CUDA-enabled wheels load these separately distributed host providers by
# SONAME. CPU-only installations do not need to install the proprietary stack.
cuda12 = [
  "nvidia-cublas-cu12>=12.9.1.4; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "nvidia-cusolver-cu12>=11.7.5.82; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "nvidia-cusparse-cu12>=12.5.10.65; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "nvidia-cuda-runtime-cu12>=12.9.79; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "nvidia-nvjitlink-cu12>=12.9.86; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]
test = [
  "pytest>=7",
  "pytest-cov",
  "ase",
  "dpdata",
]

[project.entry-points."dpdata.plugins"]
gpuxtb = "gpuxtb.dpdata"

[tool.scikit-build]
minimum-version = "build-system.requires"
sdist.include = [
  "cmake/3rdparty/implib/**",
  "cmake/3rdparty/implib_manifest.json",
  "data/parameters/*_manifest.json",
  "data/parameters/manifest.json",
]
sdist.exclude = [
  "build*/**",
  ".cache/**",
  ".claude/**",
  ".ruff_cache/**",
  "compile_commands.json",
]
cmake.args = [
  "-DGPUXTB_BUILD_TESTS=OFF",
  "-DGPUXTB_PYTHON_WHEEL=ON",
  "-DBUILD_SHARED_LIBS=ON",
]
wheel.packages = ["python/gpuxtb"]
wheel.install-dir = "gpuxtb"
# ctypes does not link against a CPython ABI.  Emit one platform wheel that is
# usable by every supported Python version instead of duplicate cp311/cp314
# archives containing identical native code.
wheel.py-api = "py3"

# GPUXTB_ENABLE_CUDA: AUTO enables the CUDA backend whenever a CUDA toolkit with
# nvcc is available at build time and produces a CPU-only wheel otherwise. It
# can be forced with, e.g.,
# ``GPUXTB_ENABLE_CUDA=ON pip install .`` (see python/README.md).
[tool.scikit-build.cmake.define]
GPUXTB_ENABLE_CUDA = { env = "GPUXTB_ENABLE_CUDA", default = "AUTO" }
# Ship optimized SASS for the main data-center/consumer generations plus
# Blackwell instead of relying on nvcc's legacy default architecture/PTX JIT.
CMAKE_CUDA_ARCHITECTURES = { env = "GPUXTB_CUDA_ARCHITECTURES", default = "80;89;90;120" }

# cibuildwheel: build wheels across platforms. The .github/workflows/wheels.yml
# matrix drives exactly which build each runner produces via CIBW_BUILD and
# whether GPUXTB_ENABLE_CUDA is ON (Linux x86_64, CUDA manylinux image) or OFF
# everywhere else. Linux x86_64 also runs the full conformance suite through
# cibuildwheel's own test feature (`test-extras`); the other platforms get an
# import smoke test.
[tool.cibuildwheel]
build = ["cp311-*"]
# Use uv for the isolated build environment (via `build --installer=uv`) and
# for creating the test environments.
build-frontend = "build[uv]"
skip = ["*-win32", "*-manylinux_i686", "*-musllinux*"]
# CUDA-enabled manylinux images provided by PyPA (quay.io/manylinux_cuda); they
# ship nvcc/cublas/cudart but not cuSOLVER, so a Linux before-build installs
# the missing libcusolver/libnvJitLink from PyPI into the toolkit lib dir.
manylinux-x86_64-image = "quay.io/manylinux_cuda/manylinux_2_28_x86_64_cuda12_9@sha256:a35c3237c45cb761c99c0c52d2a26f9dffe89f0104f5daaa45284e9efe4bdf9d"
manylinux-aarch64-image = "quay.io/manylinux_cuda/manylinux_2_28_aarch64_cuda12_9@sha256:0aa4ed0b679c8e73d422ca583dab8c41d0e8e0700dc8334be40cbd61e5a85b14"
# Default test is an import smoke test (importing gpuxtb needs no runtime); the
# x86_64 Linux CI entry overrides it with the full conformance suite.
test-command = "python -c 'import gpuxtb; print(gpuxtb.library.get_version())'"

[tool.cibuildwheel.linux]
before-build = "bash {package}/python/ci/install-cuda-wheel-deps.sh"
# CUDA host shared libraries (cublas/cusolver/cudart/...) are intentionally not
# bundled: the trampolines resolve the system CUDA driver plus the
# PyPI-distributed nvidia-* packages at runtime. libcuda.so.1 is the NVIDIA
# driver interface and is likewise provided by the system, never bundled.
# The device link disables cudadevrt explicitly. NVIDIA libdevice compiler
# output may still be present and remains covered by the additional permission.
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} --exclude libcublas.so.12 --exclude libcublasLt.so.12 --exclude libcusolver.so.11 --exclude libcusparse.so.12 --exclude libcudart.so.12 --exclude libnvJitLink.so.12 --exclude libcufft.so.11 --exclude libcurand.so.10 --exclude libcuda.so.1"

[tool.ruff]
# Ruff owns both formatting and import ordering so those policies cannot drift.
# The remaining families enforce docstrings, typing, NumPy compatibility, safe
# exceptions, explicit iteration semantics, and focused simplification checks.
extend-exclude = ["cmake/3rdparty/implib/implib-gen.py"]
lint.select = [
  "E",
  "W",
  "F",
  "I",
  "D",
  "UP",
  "C4",
  "RUF",
  "NPY",
  "TID251",
  "TID253",
  "T20",
  "B",
  "BLE001",
  "N804",
  "N805",
  "DTZ",
  "TCH",
  "PYI",
  "ANN",
  "PIE808",
  "PT022",
  "RET502",
  "SIM",
  "TD006",
  "PLR1711",
  "PLR1733",
  "PLR2044",
  "PERF",
]

[tool.ruff.lint.pydocstyle]
# The Python API and scientific tooling already use NumPy-style sections.
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
# PyTorch is an optional benchmark dependency with significant import cost.
# Production adapters already load it lazily through importlib.
banned-module-level-imports = ["torch"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Matrix multiplication and broadcasting must use explicit ndarray semantics.
"numpy.matrix".msg = "Use numpy.ndarray; numpy.matrix has implicit 2-D and multiplication semantics."

[tool.ruff.lint.per-file-ignores]
# benchmarks/run.py appends a tools path to sys.path before importing
# gpuxtb_conformance/gpuxtb_public_api; those imports cannot move to the top.
"benchmarks/run.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra"

[tool.coverage.run]
# The CI suite imports the source tree while loading the native library from
# the installed wheel. Relative paths let GitHub map every measured line back
# to the corresponding repository file.
include = ["python/gpuxtb/*"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"
