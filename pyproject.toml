[build-system]
requires = [
  "scikit-build-core>=1.0.3",
  "setuptools-scm>=10.2.1",
]
build-backend = "scikit_build_core.build"

[project]
name = "xtbloom"
dynamic = ["version"]
description = "Batched GFN1/GFN2-xTB inference through the public C ABI"
readme = { file = "python/README.md", content-type = "text/markdown" }
license = "GPL-3.0-or-later"
license-files = [
  "LICENSE",
  "CUDA_MKL_LINKING_EXCEPTION",
  "THIRD_PARTY_NOTICES.md",
  "LICENSES/*.txt",
  "data/parameters/d4.NOTICE",
  "data/parameters/licenses/*",
]
requires-python = ">=3.10"
authors = [{ name = "xTBloom developers" }]
maintainers = [{ name = "Jinzhe Zeng", email = "jinzhe.zeng@ustc.edu.cn" }]
keywords = ["xtb", "tight-binding", "semiempirical", "qm", "gpu"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.20",
  # MIT-licensed, dependency-free backend-neutral array probing for the
  # DLPack/Array API consumption path; see THIRD_PARTY_NOTICES.md.
  "array-api-compat>=1.15,<2",
]

[project.urls]
Homepage = "https://xtbloom.jinzhezeng.group"
Documentation = "https://github.com/jinzhezenggroup/xtbloom/blob/main/docs/index.md"
Repository = "https://github.com/jinzhezenggroup/xtbloom"
Issues = "https://github.com/jinzhezenggroup/xtbloom/issues"
"Web demo" = "https://xtbloom.jinzhezeng.group"

[project.optional-dependencies]
ase = ["ase"]
dpdata = ["dpdata"]
# CUDA-enabled wheels load these separately distributed host providers by
# SONAME. CPU-only installations do not need to install the proprietary stack.
cuda12 = [
  "nvidia-cublas-cu12>=12.9.1.4; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "nvidia-cusolver-cu12>=11.7.5.82; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "nvidia-cusparse-cu12>=12.5.10.65; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "nvidia-cuda-runtime-cu12>=12.9.79; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "nvidia-nvjitlink-cu12>=12.9.86; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]
test = [
  "pytest>=7",
  "pytest-cov",
  "ase",
  "dpdata",
]

# Used by the ty-pre-commit hook so its ephemeral type-check environment can
# resolve the optional third-party imports that ``python/xtbloom`` actually
# type checks (ase.py, dpdata.py). Kept separate from the `extras` so type
# checking never installs the pytest test tooling.
[dependency-groups]
typechecking = ["ase", "dpdata"]
# Nox is a locked development orchestrator, not a project extra or published
# runtime dependency.  The noxfile keeps the exact CMake/CTest and uv commands
# authoritative instead of resolving another copy of the project environment.
nox = ["nox==2026.7.11"]
# PyTorch is needed only to execute the public autograd integration tests in
# required CI. Keep it out of project extras so wheels and normal test-extra
# installations retain the package's optional, lazy-import contract.
torch-testing = ["torch==2.13.0"]
# Lock the reviewed wheel-build input without publishing it as Requires-Dist.
# xTBloom vendors only its verified LP64 provider cohort into native wheels;
# users must not install or import scipy-openblas32 at runtime. Platform
# markers keep uv.lock authoritative for every redistributed desktop artifact.
wheel-build = [
  "scipy-openblas32==0.3.34.0.0; (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'arm64')) or (sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'ARM64'))",
]

# Install the typechecking group by default so `uv check` (the ty-pre-commit
# hook) and plain `uv sync` both resolve ase/dpdata without extra flags. The
# repository has no `dev` group to preserve.
[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]
default-groups = ["typechecking"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"

[tool.setuptools_scm.tag]
regex = '^v(?P<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$'

[tool.setuptools_scm.scm.git]
pre_parse = "fail_on_shallow"
describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--abbrev=40",
  "--match",
  "v*",
]

[project.entry-points."dpdata.plugins"]
xtbloom = "xtbloom.dpdata"

[tool.scikit-build]
minimum-version = "build-system.requires"
sdist.include = [
  "src/bindings/torch/xtbloom_torch_ext.cpp",
  "cmake/3rdparty/implib/**",
  "cmake/3rdparty/implib_manifest.json",
  "cmake/3rdparty/torch-stable/**",
  "cmake/3rdparty/eigen_manifest.json",
  "cmake/3rdparty/scipy_openblas32_manifest.json",
  "cmake/3rdparty/pyodide_openblas_manifest.json",
  "cmake/3rdparty/pyodide-openblas/**",
  "LICENSES/eigen/**",
  "tools/eigen_dependency.py",
  "data/parameters/*_manifest.json",
  "data/parameters/manifest.json",
  # CMake invokes this resolver when a source build explicitly requests the
  # reviewed private OpenBLAS wheel input. Other python/ci scripts belong to
  # the repository's checkout-based release-wheel orchestration.
  "python/ci/resolve-openblas-wheel.py",
]
sdist.exclude = [
  # PyPI source distributions are installation inputs, not repository
  # snapshots. Keep build sources, generated parameters and their generators,
  # vendored build inputs, provenance, and legal material; exclude validation,
  # publication, Web, CI, and coding-agent surfaces that are not read while
  # building a wheel from the unpacked archive.
  ".agents/**",
  ".github/**",
  "benchmarks/**",
  "data/conformance/**",
  "docs/**",
  "python/ci/**",
  "python/tests/**",
  "skills/**",
  "tests/**",
  "tools/conformance/**",
  "tools/check_benchmark_evidence_size.py",
  "tools/cloudflare-pages/**",
  "tools/licensing/**",
  "tools/oracle/**",
  "tools/scc_reuse/**",
  "web/**",
  ".clang-format",
  ".gitattributes",
  ".gitignore",
  ".pre-commit-config.yaml",
  "AGENTS.md",
  "noxfile.py",
  "src/backends/cuda/gfn2_energy_force_execution_test.cuh",
  "uv.lock",
  "build*/**",
  ".cache/**",
  ".claude/**",
  ".ruff_cache/**",
  "compile_commands.json",
]
cmake.args = [
  "-DXTBLOOM_BUILD_TESTS=OFF",
  "-DXTBLOOM_PYTHON_WHEEL=ON",
  "-DBUILD_SHARED_LIBS=ON",
  # Wheel payload paths are part of the Python package contract. Do not let
  # GNUInstallDirs select architecture-specific directories such as lib64 on
  # aarch64; native libraries live in xtbloom/lib on every wheel platform.
  "-DCMAKE_INSTALL_LIBDIR=lib",
]
wheel.packages = ["python/xtbloom"]
wheel.install-dir = "xtbloom"
# Neither the ctypes-loaded libxtbloom nor the torch.ops-loaded LibTorch Stable
# ABI extension is a CPython extension module. Emit one platform wheel that is
# usable by every supported Python version instead of duplicate cp311/cp314 or
# cp313t/cp314t archives containing identical native code. Free-threaded Python
# is therefore a runtime-validation target for this wheel, not another artifact.
wheel.py-api = "py3"

# scipy-openblas32 explicitly warns against use as an end-user dependency. It
# is therefore requested only for audited cibuildwheel builds and never appears
# in runtime metadata, editable builds, or an sdist build environment.
[[tool.scikit-build.overrides]]
if.state = "^wheel$"
if.platform-system = "(?i)^(linux|darwin|macos|windows|win32)$"
if.platform-machine = "(?i)^(x86_64|aarch64|arm64|amd64)$"
if.env.XTBLOOM_BUNDLE_WHEEL_OPENBLAS = "^ON$"
build.requires = ["scipy-openblas32==0.3.34.0.0"]

# XTBLOOM_ENABLE_CUDA: AUTO enables the CUDA backend whenever a CUDA toolkit with
# nvcc is available at build time and produces a CPU-only wheel otherwise. It
# can be forced with, e.g.,
# ``XTBLOOM_ENABLE_CUDA=ON uv sync --no-editable --extra cuda12``
# (see python/README.md).
[tool.scikit-build.cmake.define]
XTBLOOM_ENABLE_CUDA = { env = "XTBLOOM_ENABLE_CUDA", default = "AUTO" }
XTBLOOM_BUNDLE_WHEEL_OPENBLAS = { env = "XTBLOOM_BUNDLE_WHEEL_OPENBLAS", default = "OFF" }
# Compile for every major CUDA architecture generation the toolkit supports
# (CMake's `all-major` keyword: one representative arch per computed-major
# family), so wheels run on any NVIDIA GPU generation the build toolkit covers
# with far less fat SASS than `all`. Set XTBLOOM_CUDA_ARCHITECTURES to a
# narrower list to trade coverage for faster builds/smaller artifacts.
CMAKE_CUDA_ARCHITECTURES = { env = "XTBLOOM_CUDA_ARCHITECTURES", default = "all-major" }
# ccache compiler launchers: CI sets the XTBLOOM_*_COMPILER_LAUNCHER variables to
# "ccache" (see ci.yml and wheels.yml) to reuse compiled C, C++, and CUDA
# objects across runs. An empty default keeps local builds launcher-free when
# the variables are unset.
CMAKE_C_COMPILER_LAUNCHER = { env = "XTBLOOM_C_COMPILER_LAUNCHER", default = "" }
CMAKE_CXX_COMPILER_LAUNCHER = { env = "XTBLOOM_CXX_COMPILER_LAUNCHER", default = "" }
CMAKE_CUDA_COMPILER_LAUNCHER = { env = "XTBLOOM_CUDA_COMPILER_LAUNCHER", default = "" }

# cibuildwheel: build wheels across platforms. The .github/workflows/wheels.yml
# matrix drives exactly which build each runner produces via CIBW_BUILD and
# whether XTBLOOM_ENABLE_CUDA is ON (Linux x86_64, CUDA manylinux image) or OFF
# everywhere else. Linux x86_64 runs the full Python suite; native aarch64 runs
# installed-wheel CPU and Torch inference smoke. Windows AMD64 and macOS arm64
# also run the compiled Torch op against the separately installed official
# runtime; Windows ARM64 and macOS x86_64 retain CPU-only tests because PyTorch
# 2.10+ publishes no supported runtime wheels for those architectures. Pyodide
# 314.x repairs the reviewed official OpenBLAS side module into the wheel and
# runs installed-wheel GFN2 conformance plus NumPy/SciPy coexistence.
[tool.cibuildwheel]
build = ["cp311-*"]
# Use uv for the isolated build environment (via `build --installer=uv`) and
# for creating the test environments.
build-frontend = "build[uv]"
skip = ["*-win32", "*-manylinux_i686", "*-musllinux*"]
# CUDA-enabled manylinux images provided by PyPA (quay.io/manylinux_cuda). They
# ship nvcc and the cudart headers the compile needs; the proprietary provider
# libraries (cuBLAS/cuSOLVER/cudart/driver) are never required to build, because
# xTBloom self-declares the host C API surface (src/runtime/nvidia_host_api.h)
# and generates lazy-dlopen trampolines from the curated symbol lists with
# pinned SONAMEs. The dlopen'd libraries are supplied at run time by the system
# or the PyPI-distributed nvidia-* packages. Quay deletes an untagged previous
# manifest when latest rotates, so retain the reviewed dated tag and also pin
# its immutable digest instead of following latest.
manylinux-x86_64-image = "quay.io/manylinux_cuda/manylinux_2_28_x86_64_cuda12_9:2026.06.30-1@sha256:c436610a82597bfff72a6e8aa0de0eaa5a717a00d93354a422fde02beddd15d3"
manylinux-aarch64-image = "quay.io/manylinux_cuda/manylinux_2_28_aarch64_cuda12_9:2026.06.30-1@sha256:c994f30615152ae4ec6287d67a15ab79d7bbda14debd5b38bc4d4d96b8d267fb"
# Default test is an import smoke test (importing xTBloom needs no runtime); the
# x86_64 Linux CI entry overrides it with the full conformance suite.
test-command = "python -c 'import xtbloom; print(xtbloom.library.get_version())'"

[tool.cibuildwheel.linux]
# Install the PEP 735 test-only Torch group in both repaired-wheel test
# environments. Project extras alone do not include dependency groups.
test-groups = ["torch-testing"]
# before-build runs inside the build container (once per container, idempotent
# scripts). The image supplies nvcc's compiler-support files, while provider
# shared libraries are unnecessary (see the stub-mode comment above), so only
# the CUDA-capable ccache (>= 4.1, needed for nvcc; the manylinux_2_28 distro
# ccache 3.7 cannot cache CUDA) and the provenance-pinned private OpenBLAS
# wheel provider are prepared. The PyTorch stable-ABI extension is compiled
# from manifest-pinned vendored headers plus a build-time-only libtorch_cpu
# stub.
before-build = "bash {package}/python/ci/prepare-wheel-build.sh"
# CUDA host shared libraries (cublas/cusolver/cudart/...) are intentionally not
# bundled: the trampolines resolve the system CUDA driver plus the
# PyPI-distributed nvidia-* packages at runtime. libcuda.so.1 is the NVIDIA
# driver interface and is likewise provided by the system, never bundled.
# The device link disables cudadevrt explicitly. NVIDIA libdevice compiler
# output may still be present and remains covered by the additional permission.
# The torch extension links only libtorch_cpu.so for its stable aoti_torch_*
# C shim symbols. With the vendored-headers + build-time-stub build the wheel is
# produced in an environment that never installs torch, so auditwheel cannot
# see libtorch_cpu.so and it is never bundled. The repair script still excludes
# it defensively while also resolving and vendoring the reviewed private
# OpenBLAS cohort.
repair-wheel-command = "bash {package}/python/ci/repair-wheel.sh {dest_dir} {wheel}"

[tool.cibuildwheel.pyodide]
# The hook prepares the hash-pinned Pyodide 314.0.4 provider after cibuildwheel
# installs its xbuildenv. auditwheel-emscripten then follows the adapter's
# content-qualified NEEDED edge and writes relocation-safe runtime paths.
before-build = "bash {package}/python/ci/prepare-wheel-build.sh"
repair-wheel-command = "bash {package}/python/ci/repair-wheel.sh {dest_dir} {wheel}"
# SciPy is a coexistence oracle only. It remains absent from project metadata
# and proves both load orders against Pyodide's separately installed package.
test-requires = ["scipy==1.18.0"]

[tool.ruff]
# Ruff owns both formatting and import ordering so those policies cannot drift.
# The remaining families enforce docstrings, typing, NumPy compatibility, safe
# exceptions, explicit iteration semantics, and focused simplification checks.
extend-exclude = ["cmake/3rdparty/implib/implib-gen.py"]
lint.select = [
  "E",
  "W",
  "F",
  "I",
  "D",
  "UP",
  "C4",
  "RUF",
  "NPY",
  "TID251",
  "TID253",
  "T20",
  "B",
  "BLE001",
  "N804",
  "N805",
  "DTZ",
  "TCH",
  "PYI",
  "ANN",
  "PIE808",
  "PT022",
  "RET502",
  "SIM",
  "TD006",
  "PLR1711",
  "PLR1733",
  "PLR2044",
  "PERF",
]

[tool.ruff.lint.pydocstyle]
# The Python API and scientific tooling already use NumPy-style sections.
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
# PyTorch is an optional benchmark dependency with significant import cost.
# Production adapters already load it lazily through importlib.
banned-module-level-imports = ["torch"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Matrix multiplication and broadcasting must use explicit ndarray semantics.
"numpy.matrix".msg = "Use numpy.ndarray; numpy.matrix has implicit 2-D and multiplication semantics."

[tool.ruff.lint.per-file-ignores]
# benchmarks/run.py appends a tools path to sys.path before importing
# xtbloom_conformance/xtbloom_public_api; those imports cannot move to the top.
"benchmarks/run.py" = ["E402"]
# Test method names already state their focused contract; class/module
# docstrings provide the surrounding scientific intent.
"tests/parameters/test_gfn1*.py" = ["D102"]

[tool.ty.src]
# The ty-pre-commit hook checks the whole project with no positional paths, so
# the default include determines what CI type checks. Scope it to the Python
# package: xTBloom's tools, tests, and benchmarks are not type checked.
include = ["python/xtbloom"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra"

[tool.coverage.run]
# The CI suite imports the source tree while loading the native library from
# the installed wheel. Relative paths let GitHub map every measured line back
# to the corresponding repository file.
include = ["python/xtbloom/*"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"
