[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "gpuxtb"
version = "0.1.0"
description = "Batched CPU and GPU inference for GFN-xTB through the public C ABI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "gpuxtb developers" }]
keywords = ["xtb", "tight-binding", "semiempirical", "qm", "gpu"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
ase = ["ase"]
dpdata = ["dpdata"]
# CUDA-enabled wheels do not bundle the CUDA runtime; the PyPI nvidia-* packages
# supply it at runtime (the CUDA *driver* still comes from the system kernel).
cuda = [
  "cuda-python",
  "nvidia-cublas-cu12",
  "nvidia-cusolver-cu12",
  "nvidia-cusparse-cu12",
  "nvidia-cuda-runtime-cu12",
  "nvidia-nvjitlink-cu12",
]
test = ["pytest>=7", "pytest-cov", "ase", "dpdata"]

[project.entry-points."dpdata.plugins"]
gpuxtb = "gpuxtb.dpdata"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.args = [
  "-DGPUXTB_BUILD_TESTS=OFF",
  "-DBUILD_SHARED_LIBS=ON",
]
wheel.packages = ["python/gpuxtb"]
wheel.install-dir = "gpuxtb"

# GPUXTB_ENABLE_CUDA: AUTO enables the CUDA backend whenever a CUDA compiler is
# available at build time (system, or pip-installed CUDA packages) and produces
# a CPU-only wheel otherwise. It can be forced with, e.g.,
# ``GPUXTB_ENABLE_CUDA=ON pip install .`` (see python/README.md).
[tool.scikit-build.cmake.define]
GPUXTB_ENABLE_CUDA = { env = "GPUXTB_ENABLE_CUDA", default = "AUTO" }

# cibuildwheel: build CPython wheels for Linux in the CUDA-enabled manylinux
# images provided by PyPA (quay.io/manylinux_cuda). GPUXTB_ENABLE_CUDA defaults
# to AUTO, so nvcc being present in the image enables the CUDA backend
# automatically; the image also carries the CUDA runtime/toolkit libraries used
# at link time.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
# Tests run through cibuildwheel's own test feature (official `test-command`).
# macOS only gets an import smoke test because its CPU inference needs an MKL
# runtime exposing the libmkl_rt.so names the eigensolver dlopens; Linux runs
# the full conformance suite (see [tool.cibuildwheel.linux] below).
test-command = "python -c 'import gpuxtb, gpuxtb.library, gpuxtb.interface'"

[tool.cibuildwheel.linux]
# CUDA-enabled manylinux images provided by PyPA (quay.io/manylinux_cuda); nvcc
# in the image means GPUXTB_ENABLE_CUDA=AUTO builds the CUDA backend. The image
# ships cublas/cudart but not cuSOLVER, so before-build installs the missing
# libcusolver/libnvJitLink from PyPI into the toolkit lib dir.
archs = ["x86_64"]
manylinux-x86_64-image = "quay.io/manylinux_cuda/manylinux_2_28_x86_64_cuda12_9:latest"
manylinux-aarch64-image = "quay.io/manylinux_cuda/manylinux_2_28_aarch64_cuda12_9:latest"
before-build = "bash {package}/python/ci/install-cuda-wheel-deps.sh"
# Run the full conformance suite with cibuildwheel's test feature. The helper
# adds the pip-installed MKL and the container CUDA runtimes to LD_LIBRARY_PATH.
before-test = "python -m pip install --quiet pytest ase dpdata mkl"
test-command = "bash {project}/python/ci/run-wheel-tests.sh"
# The CUDA runtime libraries (cublas/cusolver/cudart/...) are intentionally not
# bundled: a CUDA-enabled wheel relies on the system CUDA driver plus the
# PyPI-distributed `nvidia-cublas-cu12`/`nvidia-cusolver-cu12`/
# `nvidia-cuda-runtime-cu12` packages at runtime. libcuda.so.1 is the NVIDIA
# driver interface and is likewise provided by the system, never bundled.
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} --exclude libcublas.so.12 --exclude libcublasLt.so.12 --exclude libcusolver.so.12 --exclude libcusparse.so.12 --exclude libcudart.so.12 --exclude libcufft.so.11 --exclude libcurand.so.10 --exclude libcuda.so.1"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra"