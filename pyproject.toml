[build-system]
requires = ["scikit-build-core>=0.9"]
build-backend = "scikit_build_core.build"

[project]
name = "gpuxtb"
version = "0.1.0"
description = "Batched CPU and GPU inference for GFN-xTB through the public C ABI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "gpuxtb developers" }]
keywords = ["xtb", "tight-binding", "semiempirical", "qm", "gpu"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.20",
  # The CPU eigensolver dlopens libmkl_rt; ship it automatically on platforms
  # where the PyPI `mkl` package exists so users never set LD_LIBRARY_PATH.
  # gpuxtb.library() locates and preloads it on import.
  "mkl; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
ase = ["ase"]
dpdata = ["dpdata"]
# CUDA-enabled wheels do not bundle the CUDA runtime; the PyPI nvidia-* packages
# supply it at runtime (the CUDA *driver* still comes from the system kernel).
# gpuxtb.library() locates and preloads them on import.
cuda = [
  "cuda-python",
  "nvidia-cublas-cu12",
  "nvidia-cusolver-cu12",
  "nvidia-cusparse-cu12",
  "nvidia-cuda-runtime-cu12",
  "nvidia-nvjitlink-cu12",
]
test = [
  "pytest>=7",
  "pytest-cov",
  "ase",
  "dpdata",
  "mkl; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.entry-points."dpdata.plugins"]
gpuxtb = "gpuxtb.dpdata"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.args = [
  "-DGPUXTB_BUILD_TESTS=OFF",
  "-DBUILD_SHARED_LIBS=ON",
]
wheel.packages = ["python/gpuxtb"]
wheel.install-dir = "gpuxtb"

# GPUXTB_ENABLE_CUDA: AUTO enables the CUDA backend whenever a CUDA compiler is
# available at build time (system, or pip-installed CUDA packages) and produces
# a CPU-only wheel otherwise. It can be forced with, e.g.,
# ``GPUXTB_ENABLE_CUDA=ON pip install .`` (see python/README.md).
[tool.scikit-build.cmake.define]
GPUXTB_ENABLE_CUDA = { env = "GPUXTB_ENABLE_CUDA", default = "AUTO" }

# cibuildwheel: build wheels across platforms. The .github/workflows/wheels.yml
# matrix drives exactly which build each runner produces via CIBW_BUILD and
# whether GPUXTB_ENABLE_CUDA is ON (Linux x86_64, CUDA manylinux image) or OFF
# everywhere else. Linux x86_64 also runs the full conformance suite through
# cibuildwheel's own test feature (`test-extras`); the other platforms get an
# import smoke test.
[tool.cibuildwheel]
build = ["cp311-*", "cp314-*"]
skip = ["*-win32", "*-manylinux_i686", "*-musllinux*"]
# CUDA-enabled manylinux images provided by PyPA (quay.io/manylinux_cuda); they
# ship nvcc/cublas/cudart but not cuSOLVER, so a Linux before-build installs
# the missing libcusolver/libnvJitLink from PyPI into the toolkit lib dir.
manylinux-x86_64-image = "quay.io/manylinux_cuda/manylinux_2_28_x86_64_cuda12_9:latest"
manylinux-aarch64-image = "quay.io/manylinux_cuda/manylinux_2_28_aarch64_cuda12_9:latest"
# Default test is an import smoke test (importing gpuxtb needs no runtime); the
# x86_64 Linux CI entry overrides it with the full conformance suite.
test-command = "python -c 'import gpuxtb, gpuxtb.library, gpuxtb.interface'"

[tool.cibuildwheel.linux]
before-build = "bash {package}/python/ci/install-cuda-wheel-deps.sh"
# The CUDA runtime libraries (cublas/cusolver/cudart/...) are intentionally not
# bundled: a CUDA-enabled wheel relies on the system CUDA driver plus the
# PyPI-distributed nvidia-* packages at runtime. libcuda.so.1 is the NVIDIA
# driver interface and is likewise provided by the system, never bundled.
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} --exclude libcublas.so.12 --exclude libcublasLt.so.12 --exclude libcusolver.so.12 --exclude libcusparse.so.12 --exclude libcudart.so.12 --exclude libcufft.so.11 --exclude libcurand.so.10 --exclude libcuda.so.1"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-ra"