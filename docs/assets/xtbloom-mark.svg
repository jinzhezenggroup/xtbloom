<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="xtbloom-mark-title xtbloom-mark-description">
  <title id="xtbloom-mark-title">xTBloom orbital bloom mark</title>
  <desc id="xtbloom-mark-description">Three woven molecular-orbital threads form a six-petal bloom around an atomic center.</desc>
  <defs>
    <style>
      .orbit-blue { stroke: #365fd3; }
      .orbit-green { stroke: #2a9d83; }
      .orbit-amber { stroke: #c77b16; }
      .center-ring { stroke: #365fd3; }
      @media (prefers-color-scheme: dark) {
        .orbit-blue { stroke: #7698ff; }
        .orbit-green { stroke: #58d7b8; }
        .orbit-amber { stroke: #f0b55e; }
        .center-ring { stroke: #f1f7f5; }
      }
    </style>
    <radialGradient id="mark-center-glow" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#365fd3"/>
    </radialGradient>
  </defs>
  <ellipse class="orbit-blue" cx="100" cy="100" rx="78" ry="34" fill="none" stroke-width="11" stroke-linecap="round"/>
  <ellipse class="orbit-green" cx="100" cy="100" rx="78" ry="34" fill="none" stroke-width="11" stroke-linecap="round" transform="rotate(60 100 100)"/>
  <ellipse class="orbit-amber" cx="100" cy="100" rx="78" ry="34" fill="none" stroke-width="11" stroke-linecap="round" transform="rotate(120 100 100)"/>
  <circle class="center-ring" cx="100" cy="100" r="18" fill="url(#mark-center-glow)" stroke-width="5"/>
  <circle cx="100" cy="100" r="5" fill="#ffffff" opacity="0.9"/>
</svg>
