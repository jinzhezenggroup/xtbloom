# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # v6.0.0
    hooks:
      - id: trailing-whitespace
        # These exact generated or hash-pinned artifacts have canonical bytes.
        # Retained Eigen legal records and Pyodide recipe/license bytes are
        # pinned by manifests. Read-only integrity tests still cover them.
        exclude: ^(?:cmake/3rdparty/pyodide-openblas/recipe/.*|LICENSES/eigen/.*|data/parameters/(?:(?:gfn1|gfn2)\.(?:toml|json|hpp)|gfn1_(?:manifest|d3(?:_manifest)?)\.json|gfn1_d3\.hpp|manifest\.json|d4\.hpp|d4_manifest\.json)|data/conformance/scc-traces/(?:manifest-v2\.json|oh_radical\.json|specs/oh_radical\.spec)|tools/oracle/tblite_scc_trace/(?:tblite-e9abc395-scc-observer(?:-v2)?\.patch|scc_trace_(?:main|recorder)_v2\.f90|xtbloom-scc-trace-v2\.schema\.json)|LICENSES/(?:scipy-openblas32-(?:0\.3\.34\.0\.0-(?:macos|windows-amd64|windows-arm64)|tools-LICENSE_win32)|pyodide-MPL-2\.0|OpenBLAS-0\.3\.28-BSD-3-Clause|LAPACK-OpenBLAS-0\.3\.28-BSD-3-Clause|CLAPACK-3\.2\.1-BSD-3-Clause|libf2c-AT&T-Lucent-Bellcore)\.txt)$
      - id: end-of-file-fixer
        exclude: ^(?:cmake/3rdparty/pyodide-openblas/recipe/.*|LICENSES/eigen/.*|data/parameters/(?:(?:gfn1|gfn2)\.(?:toml|json|hpp)|gfn1_(?:manifest|d3(?:_manifest)?)\.json|gfn1_d3\.hpp|manifest\.json|d4\.hpp|d4_manifest\.json)|data/conformance/scc-traces/(?:manifest-v2\.json|oh_radical\.json|specs/oh_radical\.spec)|tools/oracle/tblite_scc_trace/(?:tblite-e9abc395-scc-observer(?:-v2)?\.patch|scc_trace_(?:main|recorder)_v2\.f90|xtbloom-scc-trace-v2\.schema\.json)|LICENSES/(?:scipy-openblas32-(?:0\.3\.34\.0\.0-(?:macos|windows-amd64|windows-arm64)|tools-LICENSE_win32)|pyodide-MPL-2\.0|OpenBLAS-0\.3\.28-BSD-3-Clause|LAPACK-OpenBLAS-0\.3\.28-BSD-3-Clause|CLAPACK-3\.2\.1-BSD-3-Clause|libf2c-AT&T-Lucent-Bellcore)\.txt)$
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024", "--enforce-all"]
        # This generated table is canonical and covered by its manifest.
        # Benchmark evidence has no exception: keep reproducible oversized raw
        # samples untracked and commit compact results plus provenance.
        exclude: ^data/parameters/d4\.hpp$
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5 # v0.16.0
    hooks:
      - id: ruff
        args: ["--fix"]
        types_or: [python, pyi, jupyter]
        # Exact vendored bytes are pinned by cmake/3rdparty/implib_manifest.json.
        exclude: ^cmake/3rdparty/implib/implib-gen\.py$
      - id: ruff-format
        types_or: [python, pyi, jupyter]
        exclude: ^cmake/3rdparty/implib/implib-gen\.py$
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.76 # v0.0.69
    hooks:
      - id: ty
        # --isolated stops uv from rewriting the pinned uv.lock or the local
        # environment. The typechecking group (ase, dpdata) that the checked
        # modules import is a tool.uv default group, so no --group flag is
        # needed for `uv check` to resolve it.
        args: [--isolated]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.0 # v22.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        # Only generated parameter headers, retained notice copies, and the
        # LibTorch header tree are canonical upstream bytes. Future hand-written
        # C/C++ files in their parent directories must still be formatted.
        exclude: ^(?:data/parameters/(?:gfn1(?:_d3)?|gfn2|d4|tblite_sto)\.hpp|LICENSES/eigen/notices/|cmake/3rdparty/torch-stable/include/)
  - repo: local
    hooks:
      - id: forbid-retired-project-name-content
        name: Forbid the retired project name in text
        entry: '(?i)gpu[_-]?x[t]b'
        language: pygrep
        types: [text]
      - id: forbid-retired-project-name-path
        name: Forbid the retired project name in paths
        entry: Retired project name found in a tracked path
        language: fail
        files: '(?i)gpu[_-]?x[t]b'
      - id: forbid-raw-profiler-captures
        name: Forbid raw profiler captures (nsys/ncu)
        entry: >-
          Raw profiler captures (nsys/ncu) embed the target process
          environment and credentials. Remove the file and commit only
          sanitized derived summaries (e.g. `nsys stats` / `ncu --csv`
          CSV/text output).
        language: fail
        # Extensions must stay in sync with the *.nsys-rep / *.ncu-rep /
        # *.sqlite / *.sqlite.dbb / *.csv.db / *.qdstrm / *.prof block in
        # .gitignore.
        files: '\.(nsys-rep|qdstrm|sqlite|ncu-rep|sqlite\.dbb|csv\.db|prof)$'
      - id: check-benchmark-evidence-size
        name: Enforce the tracked benchmark evidence budget
        entry: python3 tools/check_benchmark_evidence_size.py
        language: system
        pass_filenames: false
        always_run: true

# pre-commit.ci blocks network access for hooks, but ty-pre-commit needs to
# resolve dependencies, so it must be skipped there. The repository's own
# CI runs ty through prek (.github/workflows/pre-commit.yml) instead.
ci:
  skip: [ty]
