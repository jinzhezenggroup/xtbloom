# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
        # These exact generated or hash-pinned artifacts have canonical bytes.
        # In particular, unified-diff blank context lines retain one leading
        # space. Read-only syntax/integrity tests still cover the files.
        exclude: ^(?:data/parameters/(?:gfn2\.(?:toml|json|hpp)|manifest\.json|d4\.hpp|d4_manifest\.json)|tools/oracle/tblite_scc_trace/tblite-e9abc395-scc-observer\.patch|LICENSES/scipy-openblas32-(?:0\.3\.34\.0\.0-(?:macos|windows-amd64|windows-arm64)|tools-LICENSE_win32)\.txt)$
      - id: end-of-file-fixer
        exclude: ^(?:data/parameters/(?:gfn2\.(?:toml|json|hpp)|manifest\.json|d4\.hpp|d4_manifest\.json)|tools/oracle/tblite_scc_trace/tblite-e9abc395-scc-observer\.patch|LICENSES/scipy-openblas32-(?:0\.3\.34\.0\.0-(?:macos|windows-amd64|windows-arm64)|tools-LICENSE_win32)\.txt)$
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024", "--enforce-all"]
        # Canonical generated or raw evidence artifacts; each exact file is
        # tracked with a committed SHA-256 manifest.
        exclude: ^(?:data/parameters/d4\.hpp|benchmarks/evidence/issue-168/2026-08-06-epyc7k62/(?:xtbloom-fresh|xtbloom-warm|tblite-persistent)\.json|benchmarks/evidence/issue-256/2026-08-09-node3-stage-a/xtbloom-warm\.json|benchmarks/evidence/issue-13/2026-08-09-node3-pr231/(?:dxtb-cpu-b512|xtbloom-(?:cpu|cuda)-b(?:128|512)|ref-tblite-b512|xtb-b512)\.json)$
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # v0.16.0
    hooks:
      - id: ruff
        args: ["--fix"]
        types_or: [python, pyi, jupyter]
        # Exact vendored bytes are pinned by cmake/3rdparty/implib_manifest.json.
        exclude: ^cmake/3rdparty/implib/implib-gen\.py$
      - id: ruff-format
        types_or: [python, pyi, jupyter]
        exclude: ^cmake/3rdparty/implib/implib-gen\.py$
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: a4405bd34b6505ed51226ba2a5b5428625177d6a # v0.0.69
    hooks:
      - id: ty
        # --isolated stops uv from rewriting the pinned uv.lock or the local
        # environment. The typechecking group (ase, dpdata) that the checked
        # modules import is a tool.uv default group, so no --group flag is
        # needed for `uv check` to resolve it.
        args: [--isolated]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: f4d7745e17a28aad7eed2f4874ca8d1568c11c4c # v22.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        # Only the generated parameter headers and the manifest-pinned upstream
        # LibTorch header closure are canonical bytes. Future hand-written C/C++
        # files in either parent directory must still be formatted.
        exclude: ^(?:data/parameters/(?:gfn2|d4)\.hpp|cmake/3rdparty/torch-stable/include/)
  - repo: local
    hooks:
      - id: forbid-retired-project-name-content
        name: Forbid the retired project name in text
        entry: '(?i)gpu[_-]?x[t]b'
        language: pygrep
        types: [text]
      - id: forbid-retired-project-name-path
        name: Forbid the retired project name in paths
        entry: Retired project name found in a tracked path
        language: fail
        files: '(?i)gpu[_-]?x[t]b'
      - id: forbid-raw-profiler-captures
        name: Forbid raw profiler captures (nsys/ncu)
        entry: >-
          Raw profiler captures (nsys/ncu) embed the target process
          environment and credentials. Remove the file and commit only
          sanitized derived summaries (e.g. `nsys stats` / `ncu --csv`
          CSV/text output).
        language: fail
        # Extensions must stay in sync with the *.nsys-rep / *.ncu-rep /
        # *.sqlite / *.sqlite.dbb / *.csv.db / *.qdstrm / *.prof block in
        # .gitignore.
        files: '\.(nsys-rep|qdstrm|sqlite|ncu-rep|sqlite\.dbb|csv\.db|prof)$'

# pre-commit.ci blocks network access for hooks, but ty-pre-commit needs to
# resolve dependencies, so it must be skipped there. The repository's own
# CI runs ty through prek (.github/workflows/pre-commit.yml) instead.
ci:
  skip: [ty]
